<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- Placeholder pixel-art mixer: three stone fader slots with stone caps (same palette as the other desktop icons). -->
  <!-- slot housings -->
  <rect x="1" y="1" width="4" height="14" fill="#10162a"/>
  <rect x="6" y="1" width="4" height="14" fill="#10162a"/>
  <rect x="11" y="1" width="4" height="14" fill="#10162a"/>
  <!-- slot grooves -->
  <rect x="2.5" y="2" width="1" height="12" fill="#5b5f78"/>
  <rect x="7.5" y="2" width="1" height="12" fill="#5b5f78"/>
  <rect x="12.5" y="2" width="1" height="12" fill="#5b5f78"/>
  <!-- fader caps: stone blocks with a light top edge and a dark lower edge -->
  <g>
    <rect x="1" y="8" width="4" height="3" fill="#8d939a"/>
    <rect x="1" y="8" width="4" height="1" fill="#d9d6c3"/>
    <rect x="1" y="10" width="4" height="1" fill="#5b5f78"/>
    <rect x="2" y="9" width="1" height="1" fill="#c4c2b0"/>
  </g>
  <g>
    <rect x="6" y="11" width="4" height="3" fill="#8d939a"/>
    <rect x="6" y="11" width="4" height="1" fill="#d9d6c3"/>
    <rect x="6" y="13" width="4" height="1" fill="#5b5f78"/>
    <rect x="8" y="12" width="1" height="1" fill="#c4c2b0"/>
  </g>
  <g>
    <rect x="11" y="3" width="4" height="3" fill="#8d939a"/>
    <rect x="11" y="3" width="4" height="1" fill="#d9d6c3"/>
    <rect x="11" y="5" width="4" height="1" fill="#5b5f78"/>
    <rect x="13" y="4" width="1" height="1" fill="#c4c2b0"/>
  </g>
</svg>
